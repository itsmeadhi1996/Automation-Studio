<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Recording window · Automation Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/live.css">
    <script src="/theme.js"></script>
    <script src="/live.js" defer></script>
  </head>
  <body>
    <header class="live-header">
      <span class="live-dot" aria-hidden="true"></span>
      <h1 id="live-title">Recording window</h1>
      <p id="live-status" role="status" aria-live="polite">Starting the recording browser…</p>
    </header>
    <main class="live-main">
      <figure class="remote-screen" hidden>
        <div class="remote-frame">
          <img id="remote-screen" tabindex="0" alt="Live view of the recording browser. Click it, then type to enter text.">
        </div>
        <figcaption>The browser runs on the Studio server. Click it before typing; Ctrl+V pastes text. Recorded clicks are outlined in red.</figcaption>
      </figure>
    </main>
  </body>
</html>
